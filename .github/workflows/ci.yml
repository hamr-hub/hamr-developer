name: CI

# hamr-developer CI 门禁（v0.2 路线图 阶段 C / C4，2026-11-19 接入）
#
# 开发者门户为 Vite + React SPA，当前没有单元测试框架；
# 门禁 = ESLint + 生产构建。build 内含 `tsc -b`，类型错误同样会阻断。
# 与家族其他 Vite 仓库（website / mood-calender）保持同一套 npm 语义。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支的新 push 不取消正在跑的旧 run，失败时便于回看
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: lint / build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
